name: Build APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Latest Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 libtinfo6
        pip install --upgrade pip
        pip install "buildozer>=1.6.0" "cython==0.29.33"

    - name: Generate Clean Buildozer Spec
      run: |
        rm -f buildozer.spec
        echo "[app]" >> buildozer.spec
        echo "title = OpcMobileAgent" >> buildozer.spec
        echo "package.name = opcmobileagent" >> buildozer.spec
        echo "package.domain = org.test" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas" >> buildozer.spec
        echo "version = 0.1" >> buildozer.spec
        
        # ДОБАВЛЕНЫ ПРОПАВШИЕ ЗАВИСИМОСТИ python-dateutil и six
        echo "requirements = python3,kivy==stable,asyncua,pyparsing,typing_extensions,python-dateutil,six" >> buildozer.spec
        
        echo "orientation = portrait" >> buildozer.spec
        echo "fullscreen = 0" >> buildozer.spec
        echo "android.permissions = INTERNET,ACCESS_NETWORK_STATE,ACCESS_WIFI_STATE" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 24" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.gl_backend = gl" >> buildozer.spec
        echo "[buildozer]" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec
        echo "warn_on_root = 1" >> buildozer.spec
        echo "p4a.branch = master" >> buildozer.spec
        sed -i 's/^[ \t]*//' buildozer.spec

    - name: Build with Buildozer
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpcAgent-APK
        path: bin/*.apk
