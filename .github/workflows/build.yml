name: Build APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 libtinfo6
        pip install --upgrade pip
        pip install "buildozer==1.5.0" cython==0.29.33

    - name: Force Create Correct Buildozer Spec
      run: |
        rm -f buildozer.spec
        cat << 'EOF' > buildozer.spec
        [app]
        title = OpcMobileAgent
        package.name = opcmobileagent
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy==2.3.0,asyncua
        orientation = portrait
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 24
        android.ndk = 25b
        android.ndk_api = 21
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build with Buildozer
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpcAgent-APK
        path: bin/*.apk
